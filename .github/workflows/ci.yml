name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: irp generate-synthetic --output data/synthetic --days 7
      - run: irp validate --input data/synthetic
      - run: irp build-episodes --input data/synthetic --output data/interim/episodes.csv
      - run: irp assess --input data/synthetic --output reports/generated/synthetic
